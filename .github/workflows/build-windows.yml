name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract source archive
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath .\Nuclear-Lab-Simulator-source.zip -DestinationPath .\unpacked -Force
          $project = ".\unpacked\Nuclear-Lab-Simulator\NuclearLabSimulator.csproj"
          if (-not (Test-Path $project)) { throw "Project file not found in source archive" }
          dotnet restore $project

      - name: Publish single-file Windows app
        shell: pwsh
        run: |
          $project = ".\unpacked\Nuclear-Lab-Simulator\NuclearLabSimulator.csproj"
          dotnet publish $project -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish
          if (-not (Test-Path ".\publish\NuclearLabSimulator.exe")) { throw "EXE was not produced" }

      - name: Upload EXE build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuclearLabSimulator-windows-x64
          path: publish/NuclearLabSimulator.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Nuclear Lab Simulator ${{ github.ref_name }}
          generate_release_notes: true
          files: publish/NuclearLabSimulator.exe
